<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Państwa i stolice – quiz</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
    body { display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: #1e293b; }
    header h1 { font-size: 18px; margin: 0 12px 0 0; }
    select, button, input { font: inherit; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; padding: 6px 10px; }
    button { cursor: pointer; background: #334155; }
    button:hover { background: #475569; }
    button.primary { background: #2563eb; border-color: #2563eb; }
    button.primary:hover { background: #1d4ed8; }
    main { flex: 1; display: flex; min-height: 0; }
    #mapWrap { flex: 1; position: relative; min-height: 0; }
    #map { width: 100%; height: 100%; display: block; background: #bfdbfe; touch-action: none; }
    .country { fill: #e5e7eb; stroke: #64748b; stroke-width: 0.6; vector-effect: non-scaling-stroke; }
    .country.quiz { fill: #fef3c7; }
    .country.done-ok { fill: #bbf7d0; }
    .country.done-bad { fill: #fecaca; }
    .country.target { fill: #ef4444; stroke: #7f1d1d; stroke-width: 1.5; }
    .country.learn:hover { fill: #fde68a; cursor: pointer; }
    .marker { fill: none; stroke: #dc2626; stroke-width: 3; vector-effect: non-scaling-stroke; }
    .marker-dot { fill: #ef4444; stroke: #7f1d1d; vector-effect: non-scaling-stroke; }
    #zoomBtns { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
    #zoomBtns button { width: 40px; height: 40px; padding: 0; font-size: 18px; }
    aside { width: 340px; padding: 14px; background: #1e293b; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    label { font-size: 13px; color: #94a3b8; }
    aside input[type=text] { width: 100%; font-size: 17px; padding: 9px 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row button { flex: 1; padding: 10px; }
    #feedback { font-size: 15px; line-height: 1.5; min-height: 60px; }
    .ok { color: #4ade80; } .bad { color: #f87171; } .warn { color: #facc15; }
    #stats { font-size: 14px; color: #cbd5e1; }
    #given { font-size: 20px; font-weight: 600; }
    .hidden { display: none !important; }
    #summary ul { padding-left: 18px; margin: 4px 0; }
    @media (max-width: 800px) {
      main { flex-direction: column; }
      #mapWrap { flex: none; height: 52vh; }
      aside { width: 100%; flex: 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🌍 Państwa i stolice</h1>
    <select id="continent"></select>
    <select id="mode">
      <option value="both">Państwo + stolica</option>
      <option value="name">Tylko państwo</option>
      <option value="capital">Tylko stolica</option>
    </select>
    <button id="restart" class="primary">Start / od nowa</button>
    <button id="learnBtn">📖 Tryb nauki</button>
  </header>
  <main>
    <div id="mapWrap">
      <svg id="map"></svg>
      <div id="zoomBtns">
        <button id="zIn" title="Przybliż">+</button>
        <button id="zOut" title="Oddal">−</button>
        <button id="zTarget" title="Przybliż do zaznaczonego">🎯</button>
        <button id="zReset" title="Cały kontynent">⟲</button>
      </div>
    </div>
    <aside>
      <div id="stats"></div>
      <div id="quizBox">
        <div id="given" class="hidden"></div>
        <div id="nameField">
          <label for="nameIn">Państwo</label>
          <input id="nameIn" type="text" autocomplete="off" autocapitalize="words" spellcheck="false">
        </div>
        <div id="capField" style="margin-top:8px">
          <label for="capIn">Stolica</label>
          <input id="capIn" type="text" autocomplete="off" autocapitalize="words" spellcheck="false">
        </div>
        <div class="row" style="margin-top:10px">
          <button id="checkBtn" class="primary">Sprawdź (Enter)</button>
          <button id="skipBtn">Nie wiem</button>
        </div>
        <div class="row hidden" id="nextRow" style="margin-top:10px">
          <button id="nextBtn" class="primary">Dalej (Enter) →</button>
        </div>
      </div>
      <div id="feedback"></div>
      <div id="summary" class="hidden"></div>
      <div id="learnInfo" class="hidden">Kliknij państwo na mapie, aby zobaczyć jego nazwę i stolicę.</div>
    </aside>
  </main>

  <script src="lib/d3.min.js"></script>
  <script src="lib/topojson-client.min.js"></script>
  <script src="lib/world.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
